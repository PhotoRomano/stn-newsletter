<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Our Mailing List — St. Nicholas Serbian Orthodox Church</title>
<style>
  body { margin: 0; background: #ece7dd; font-family: Georgia, serif; color: #2b2b2b; }
  .wrap { max-width: 560px; margin: 48px auto; padding: 0 20px 60px; }
  .hd { background: #8c1419; color: #fff; padding: 28px 32px; border-radius: 6px 6px 0 0; }
  .hd h1 { margin: 0 0 4px; font-size: 26px; font-family: Georgia, serif; }
  .hd p { margin: 0; color: #e8c873; font-size: 14px; font-style: italic; }
  .gold { height: 4px; background: #c9a227; }
  .body { background: #fff; border: 1px solid #ddd4c4; border-top: none; padding: 32px; }
  label { display: block; font-size: 13px; font-weight: bold; color: #5a2a2a; margin-bottom: 4px; }
  input[type=text], input[type=email], textarea, select {
    width: 100%; box-sizing: border-box; padding: 10px 12px;
    border: 1px solid #c8b8a0; border-radius: 4px; font-size: 15px;
    font-family: Georgia, serif; background: #faf8f4;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #8c1419; }
  .row { display: flex; gap: 14px; }
  .row > div { flex: 1; }
  .field { margin-bottom: 18px; }
  .section-label { font-size: 11px; font-weight: bold; letter-spacing: .6px; color: #8c1419; text-transform: uppercase; margin: 28px 0 16px; border-top: 1px solid #e7ddc6; padding-top: 18px; }
  .opt-note { font-size: 12px; color: #888; font-weight: normal; margin-left: 4px; font-style: italic; }
  .checks label { font-size: 14px; font-weight: normal; color: #2b2b2b; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer; }
  .checks input[type=checkbox] { width: 16px; height: 16px; flex-shrink: 0; }
  .req { color: #8c1419; }
  button[type=submit] {
    width: 100%; padding: 14px; background: #8c1419; color: #fff; border: none;
    border-radius: 4px; font-size: 16px; font-family: Georgia, serif;
    cursor: pointer; margin-top: 8px; letter-spacing: .3px;
  }
  button[type=submit]:hover { background: #6e0f12; }
  #msg { display: none; margin-top: 20px; padding: 16px; border-radius: 4px; font-size: 15px; text-align: center; }
  .footer-note { text-align: center; font-size: 12px; color: #999; margin-top: 24px; }
  .footer-note a { color: #8c1419; }
  @media(max-width:480px){ .row { flex-direction: column; gap: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1>Join Our Mailing List</h1>
    <p>St. Nicholas Serbian Orthodox Church &mdash; Elkins Park, PA</p>
  </div>
  <div class="gold"></div>
  <div class="body">
    <p style="margin:0 0 24px;font-size:15px;color:#555;">Stay connected with parish news, feast-day reminders, and upcoming events.</p>

    <form id="sub-form">
      <div class="row">
        <div class="field"><label>First Name <span class="req">*</span></label><input id="s-first" type="text" required placeholder="Milica"></div>
        <div class="field"><label>Last Name <span class="req">*</span></label><input id="s-last" type="text" required placeholder="Jovanović"></div>
      </div>
      <div class="field"><label>Email <span class="req">*</span></label><input id="s-email" type="email" required placeholder="you@example.com"></div>

      <div class="section-label">Tell Us More <span class="opt-note">optional</span></div>

      <div class="field"><label>Family <span class="opt-note">e.g. married with two children</span></label><input id="s-family" type="text" placeholder=""></div>
      <div class="field"><label>Your Family&rsquo;s Slava <span class="opt-note">patron saint</span></label><input id="s-slava" type="text" placeholder="e.g. St. Nicholas, St. George"></div>

      <div class="field checks">
        <label style="font-weight:bold;color:#5a2a2a;display:block;margin-bottom:10px;">Interests <span class="opt-note">optional — check any that apply</span></label>
        <label><input type="checkbox" id="s-school"> Serbian language school</label>
        <label><input type="checkbox" id="s-vol-liturgy"> Volunteering: liturgy &amp; chanting</label>
        <label><input type="checkbox" id="s-vol-kitchen"> Volunteering: kitchen &amp; food</label>
        <label><input type="checkbox" id="s-vol-youth"> Volunteering: youth programs</label>
        <label><input type="checkbox" id="s-vol-events"> Volunteering: fundraising &amp; events</label>
        <label><input type="checkbox" id="s-vol-grounds"> Volunteering: maintenance &amp; grounds</label>
      </div>

      <button type="submit">Subscribe</button>
    </form>

    <div id="msg"></div>
    <p class="footer-note"><a href="https://stnicholasphilly.org">stnicholasphilly.org</a></p>
  </div>
</div>

<script>
document.getElementById('sub-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var btn = this.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Subscribing…';

  var vol = [];
  if (document.getElementById('s-vol-liturgy').checked) vol.push('Liturgy & Chanting');
  if (document.getElementById('s-vol-kitchen').checked) vol.push('Kitchen & Food');
  if (document.getElementById('s-vol-youth').checked) vol.push('Youth Programs');
  if (document.getElementById('s-vol-events').checked) vol.push('Fundraising & Events');
  if (document.getElementById('s-vol-grounds').checked) vol.push('Maintenance & Grounds');

  var cf = [];
  var fam = document.getElementById('s-family').value.trim();
  var slava = document.getElementById('s-slava').value.trim();
  if (fam) cf.push({name: 'Family', value: fam});
  if (slava) cf.push({name: 'Slava', value: slava});
  if (document.getElementById('s-school').checked) cf.push({name: 'Serbian School Interest', value: 'Yes'});
  if (vol.length) cf.push({name: 'Volunteer Interests', value: vol.join(', ')});

  var data = {
    email: document.getElementById('s-email').value.trim(),
    first_name: document.getElementById('s-first').value.trim(),
    last_name: document.getElementById('s-last').value.trim(),
    utm_source: 'website', utm_medium: 'organic', send_welcome_email: true
  };
  if (cf.length) data.custom_fields = cf;

  fetch('https://api.beehiiv.com/v2/publications/pub_3d3143a5-5814-440b-97d6-3445e4e2ef7c/subscriptions', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer rQdhFFURUz1V5ccPYaK0hgEafBg22Tb5sQRwlxoz0jAyf1X39xP6o3IrpOHWO6V7'},
    body: JSON.stringify(data)
  }).then(function(r) {
    var msg = document.getElementById('msg');
    if (r.ok) {
      msg.style.cssText = 'display:block;background:#f0f7ee;color:#2e6b2e;border:1px solid #b8d8b8;';
      msg.textContent = 'Welcome! You’re now subscribed to our mailing list.';
      document.getElementById('sub-form').style.display = 'none';
    } else {
      msg.style.cssText = 'display:block;background:#fef0f0;color:#8c1419;border:1px solid #f0c0c0;';
      msg.textContent = 'Something went wrong. Please try again or email StNicholas.SOC@gmail.com.';
      btn.disabled = false; btn.textContent = 'Subscribe';
    }
  }).catch(function() {
    var msg = document.getElementById('msg');
    msg.style.cssText = 'display:block;background:#fef0f0;color:#8c1419;border:1px solid #f0c0c0;';
    msg.textContent = 'Connection error. Please try again or email StNicholas.SOC@gmail.com.';
    btn.disabled = false; btn.textContent = 'Subscribe';
  });
});
</script>
</body>
</html>
