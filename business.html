<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parishioner Businesses — St. Nicholas Serbian Orthodox Church</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Arial&display=swap" rel="stylesheet">
<style>
:root {
  --navy:  #02306e;
  --navy-dark: #01245a;
  --gold:  #c9a227;
  --red:   #c31f27;
  --light: #eef1f6;
  --card:  #ffffff;
  --border:#c8d5e8;
  --muted: #6a7d96;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: var(--light); color: #2b2b2b; }
.heading-font { font-family: 'El Messiri', Georgia, serif; }

/* ── Hero ── */
.bd-hero {
  position: relative; min-height: 420px; display: flex; flex-direction: column;
  justify-content: space-between; background-size: cover; background-position: center;
  background-color: var(--navy);
}
.bd-hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(1,36,90,.35) 0%, rgba(1,36,90,.4) 30%, rgba(1,18,46,.82) 65%, rgba(1,12,32,.96) 100%);
}
.bd-hero-top { position: relative; z-index: 1; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.bd-back { color: rgba(255,255,255,.85); font-size: 13px; text-decoration: none; font-weight: 600; }
.bd-back:hover { color: #fff; text-decoration: underline; }
.bd-hero-bottom { position: relative; z-index: 1; padding: 0 24px 56px; max-width: 900px; }
.bd-featured-pill {
  display: inline-block; background: var(--gold); color: #3a2e00; font-size: 11px; font-weight: 700;
  letter-spacing: .4px; text-transform: uppercase; padding: 4px 12px; border-radius: 20px; margin-bottom: 12px;
}
.bd-cat-pill {
  display: inline-block; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.4);
  color: #fff; font-size: 11.5px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
  padding: 4px 12px; border-radius: 20px; margin: 0 0 14px 8px;
}
.bd-hero h1 {
  color: #fff; font-size: 42px; font-weight: 700; line-height: 1.1; margin-bottom: 10px;
  text-shadow: 0 2px 12px rgba(0,0,0,.35);
}
.bd-hero-tagline { color: rgba(255,255,255,.92); font-size: 17px; line-height: 1.55; max-width: 620px; }

/* ── Content wrap: overlaps the hero for a layered "premium" feel ── */
.bd-wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 56px; }
.bd-grid {
  display: grid; grid-template-columns: 2fr 1fr; gap: 28px;
  margin-top: -46px; position: relative; z-index: 2;
}
@media (max-width: 860px) { .bd-grid { grid-template-columns: 1fr; margin-top: -32px; } }

.bd-card {
  background: var(--card); border-radius: 10px; box-shadow: 0 8px 28px rgba(2,48,110,.14);
  border: 1px solid var(--border);
}
.bd-main { padding: 36px 40px; }
@media (max-width: 560px) { .bd-main { padding: 26px 22px; } }
.bd-main h2.heading-font {
  font-size: 22px; color: var(--navy); font-weight: 700; margin: 0 0 16px;
  padding-bottom: 10px; border-bottom: 2px solid var(--gold);
}
.bd-about { font-size: 15.5px; line-height: 1.7; color: #3a3a3a; margin-bottom: 8px; }

/* ── Sidebar ── */
.bd-sidebar { display: flex; flex-direction: column; gap: 18px; }
.bd-sidebar-card { padding: 22px 24px; }
.bd-sidebar-card h3.heading-font {
  font-size: 14px; color: var(--navy); font-weight: 700; text-transform: uppercase;
  letter-spacing: .4px; margin-bottom: 14px;
}
.bd-connect-list { display: flex; flex-direction: column; gap: 10px; }
.bd-connect-item {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 6px;
  background: var(--light); color: var(--navy); text-decoration: none; font-size: 14px; font-weight: 700;
  border: 1px solid var(--border); transition: background .15s, border-color .15s;
}
.bd-connect-item:hover { background: #e4ebf7; border-color: var(--navy); }
.bd-connect-item .icon { font-size: 16px; width: 20px; text-align: center; }
.bd-promo-card {
  background: linear-gradient(135deg, var(--navy-dark), var(--navy)); color: #fff; padding: 20px 22px;
}
.bd-promo-card p { font-size: 13.5px; line-height: 1.55; color: #cfe0f5; margin-bottom: 12px; }
.bd-promo-card a {
  display: inline-block; background: var(--gold); color: #3a2e00; text-decoration: none;
  font-size: 12.5px; font-weight: 700; padding: 8px 14px; border-radius: 4px;
}

.bd-detail-content { margin-top: 24px; }

.bd-footer { text-align: center; padding: 30px 16px 10px; color: var(--muted); font-size: 12.5px; }
.bd-footer a { color: var(--navy); font-weight: 700; text-decoration: none; }
.bd-footer a:hover { text-decoration: underline; }

.bd-not-found { text-align: center; padding: 80px 16px; color: var(--muted); }
.bd-not-found a { color: var(--navy); }
.bd-loading { text-align: center; padding: 100px 16px; color: var(--muted); font-size: 15px; }

/* Bilingual detail_html content: mark blocks class="lang-en" / class="lang-sr" --
   visibility follows the site's stn_lang cookie (body.lang-en / body.lang-sr),
   same as the EN/СР toggle everywhere else on stnicholasphilly.org. */
body.lang-en .lang-sr { display: none; }
body.lang-sr .lang-en { display: none; }
</style>
</head>
<body>

<div class="bd-hero" id="bdHero">
  <div class="bd-hero-top">
    <a class="bd-back" href="https://stnicholasphilly.org/parish-businesses">&larr; All Parishioner Businesses</a>
  </div>
  <div class="bd-hero-bottom" id="bdLoadingHero">
    <div style="color:#fff; font-size:16px;">Loading business…</div>
  </div>
</div>

<div class="bd-wrap">
  <div class="bd-grid" id="bdGrid" style="display:none;">
    <div class="bd-card bd-main">
      <h2 class="heading-font">About</h2>
      <p class="bd-about" id="bdAbout"></p>
      <div class="bd-detail-content" id="bdDetailContent"></div>
    </div>
    <div class="bd-sidebar">
      <div class="bd-card bd-sidebar-card">
        <h3 class="heading-font">Connect</h3>
        <div class="bd-connect-list" id="bdConnectList"></div>
      </div>
      <div class="bd-card bd-promo-card">
        <p>Parishioners and friends of the parish can get featured right here, with a full page just like this one.</p>
        <a href="https://stnicholasphilly.org/parish-businesses">Learn More &rarr;</a>
      </div>
    </div>
  </div>
  <div id="bdNotFoundWrap"></div>
</div>

<div class="bd-footer">
  <div style="margin-bottom:6px;">
    <a href="https://stnicholasphilly.org/parish-businesses">&larr; Browse All Parishioner Businesses</a>
  </div>
  St. Nicholas Serbian Orthodox Church &middot; 506 Stahr Road, Elkins Park, PA 19027
</div>

<script>
const API = 'https://stnicholas-classifieds.photoromano.workers.dev';
const FALLBACK_HERO = 'https://photoromano.github.io/stn-newsletter/st_nicholas_banner.png';
let currentBusiness = null;

// Site-wide language preference, same stn_lang cookie the header EN/СР
// toggle sets everywhere else on stnicholasphilly.org (data-l="en"/"sr").
// detail_html content should mark bilingual blocks with class="lang-en" /
// class="lang-sr" (see .lang-en/.lang-sr CSS rules above).
function siteLang() {
  // The site sets stn_lang at more than one cookie scope (confirmed live
  // 2026-09-30 -- two distinct stn_lang cookies coexist after toggling).
  // Per RFC 6265, cookies with longer/more specific paths sort first in
  // document.cookie, so the path=/ cookie this page writes always sorts
  // LAST -- take the last match rather than "any sr wins", or a stale
  // narrower-path cookie permanently overrides this page's own toggle.
  const pairs = document.cookie.split(';').map(c => c.trim()).filter(c => c.startsWith('stn_lang='));
  const last = pairs[pairs.length - 1];
  return last === 'stn_lang=sr' ? 'sr' : 'en';
}

function setSiteLang(lang) {
  document.cookie = `stn_lang=${lang}; path=/; max-age=31536000`;
  applySiteLang();
}

// Fixed, short UI-chrome strings -- safe to translate directly (same tier as
// the site's own nav-label OVR dictionary). Free-form business copy (name,
// tagline) is NOT translated here -- that needs a real Serbian speaker's
// review, same standard as the newsletter's own bilingual content.
const CATEGORY_SR = {
  'Food & Catering': 'Храна и кетеринг',
  'Retail & Shops': 'Продавнице',
  'Professional Services': 'Професионалне услуге',
  'Home & Trade Services': 'Услуге за дом',
  'Health & Wellness': 'Здравље и велнес',
  'Other': 'Остало',
};
function categoryLabel(cat) { return siteLang() === 'sr' ? (CATEGORY_SR[cat] || cat) : cat; }
function featuredLabel() { return siteLang() === 'sr' ? 'Истакнути посао' : 'Featured Business'; }

function applySiteLang() {
  const lang = siteLang();
  document.body.classList.remove('lang-en', 'lang-sr');
  document.body.classList.add('lang-' + lang);
  document.querySelectorAll('.stn-lang-btn[data-l]').forEach(btn => {
    btn.classList.toggle('stn-lang-active', btn.dataset.l === lang);
  });
  const catPill = document.querySelector('.bd-cat-pill');
  if (catPill && currentBusiness) catPill.textContent = categoryLabel(currentBusiness.category);
  const featuredPill = document.querySelector('.bd-featured-pill');
  if (featuredPill) featuredPill.textContent = featuredLabel();
}

// The site's own header EN/СР buttons (.stn-lang-btn[data-l="en"/"sr"])
// don't reliably update stn_lang themselves (confirmed live 2026-09-30 --
// clicking them fires zero network requests and touches no cookie, on this
// page and on /home). Rather than build a second, redundant toggle, this
// page attaches its own working handler directly onto those SAME existing
// buttons -- via delegation on document, since the header bar they live in
// may not exist in the DOM yet when this section's script runs.
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.stn-lang-btn[data-l]');
  if (btn) setSiteLang(btn.dataset.l);
});

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function showNotFound(message) {
  document.getElementById('bdLoadingHero').innerHTML = '';
  document.getElementById('bdHero').style.backgroundImage = `url('${FALLBACK_HERO}')`;
  document.querySelector('.bd-hero-bottom').innerHTML = '<h1 class="heading-font">Business Not Found</h1>';
  document.getElementById('bdNotFoundWrap').innerHTML =
    `<div class="bd-card bd-not-found" style="margin-top:20px;">${message} <a href="https://stnicholasphilly.org/parish-businesses">Browse all parishioner businesses &rarr;</a></div>`;
}

async function loadBusiness() {
  applySiteLang();

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  if (!slug) {
    showNotFound('No business specified.');
    return;
  }

  try {
    const res = await fetch(`${API}/api/businesses/${encodeURIComponent(slug)}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Not found');
    const b = data.business;
    currentBusiness = b;

    document.title = `${b.name} — Parishioner Businesses — St. Nicholas Serbian Orthodox Church`;

    const heroUrl = b.hero_image_url || b.card_image_url || FALLBACK_HERO;
    document.getElementById('bdHero').style.backgroundImage = `url('${esc(heroUrl)}')`;

    document.querySelector('.bd-hero-bottom').innerHTML = `
      ${b.featured ? `<span class="bd-featured-pill">${featuredLabel()}</span>` : ''}
      <span class="bd-cat-pill">${esc(categoryLabel(b.category))}</span>
      <h1 class="heading-font">${esc(b.name)}</h1>
      ${b.tagline ? `<div class="bd-hero-tagline">${esc(b.tagline)}</div>` : ''}
    `;

    document.getElementById('bdAbout').textContent = b.tagline || '';
    if (!b.tagline) document.getElementById('bdAbout').style.display = 'none';

    document.getElementById('bdDetailContent').innerHTML = b.detail_html || '';

    const connect = [];
    if (b.website_url)   connect.push({ icon: '🌐', label: 'Website', href: b.website_url });
    if (b.facebook_url)  connect.push({ icon: '📘', label: 'Facebook', href: b.facebook_url });
    if (b.instagram_url) connect.push({ icon: '📷', label: 'Instagram', href: b.instagram_url });
    if (b.contact_phone) connect.push({ icon: '📞', label: b.contact_phone, href: `tel:${b.contact_phone}` });
    if (b.contact_email) connect.push({ icon: '✉️', label: 'Email', href: `mailto:${b.contact_email}` });

    const connectList = document.getElementById('bdConnectList');
    if (connect.length) {
      connectList.innerHTML = connect.map(c =>
        `<a class="bd-connect-item" href="${esc(c.href)}" target="_blank" rel="noopener"><span class="icon">${c.icon}</span> ${esc(c.label)}</a>`
      ).join('');
    } else {
      connectList.innerHTML = '<div style="font-size:13px;color:var(--muted);">No contact info listed yet.</div>';
    }

    document.getElementById('bdGrid').style.display = 'grid';
  } catch (err) {
    showNotFound('This business listing could not be found.');
  }
}

loadBusiness();
</script>

</body>
</html>
