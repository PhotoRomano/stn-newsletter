<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parish Admin — St. Nicholas</title>
<style>
:root { --navy:#02306e; --gold:#c9a227; --red:#c31f27; --border:#c8d5e8; --muted:#6a7d96; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:Arial,Helvetica,sans-serif; background:#eef1f6; color:#2b2b2b; }

.header { background:var(--navy); padding:16px 24px; border-bottom:4px solid var(--gold);
          display:flex; align-items:center; justify-content:space-between; }
.header h1 { color:#fff; font-size:18px; }
.header span { color:#a8c4e0; font-size:13px; }

.token-bar { background:#fff4d6; border-bottom:2px solid var(--gold); padding:12px 24px;
             display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; }
.token-bar input { padding:7px 10px; border:1px solid var(--border); font-size:13px;
                   border-radius:2px; width:300px; font-family:monospace; }
.token-bar button { background:var(--navy); color:#fff; border:none; padding:7px 16px;
                    font-size:13px; font-weight:700; border-radius:2px; cursor:pointer; }
.token-bar button:hover { background:#01245a; }
.token-status { font-size:12px; }
.token-status.ok  { color:#166534; }
.token-status.err { color:#991b1b; }

.body { max-width:1000px; margin:0 auto; padding:24px 16px; display:flex; flex-direction:column; gap:32px; }

.section-title {
  font-size:16px; font-weight:700; color:#fff; background:var(--navy);
  padding:10px 16px; border-left:4px solid var(--gold);
  display:flex; align-items:center; justify-content:space-between;
}
.accordion-title { cursor:pointer; user-select:none; }
.accordion-title:hover { background:#01245a; }
.accordion-chevron { font-size:13px; transition:transform .15s ease; margin-left:10px; }
.accordion-title.open .accordion-chevron { transform:rotate(90deg); }
.accordion-body { overflow:hidden; max-height:4000px; transition:max-height .2s ease; }
.accordion-body.collapsed { max-height:0; }
.badge { background:var(--red); color:#fff; font-size:11px; font-weight:700;
         padding:2px 7px; border-radius:10px; }
.badge.green { background:#166534; }

table { width:100%; border-collapse:collapse; background:#fff; font-size:13.5px; }
th { background:#f0f4fb; color:var(--navy); font-weight:700; padding:10px 12px;
     text-align:left; border-bottom:2px solid var(--border); }
td { padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:#f8fafc; }

.col-title { font-weight:600; color:var(--navy); }
.col-desc  { color:#444; max-width:280px; white-space:pre-wrap; word-break:break-word; }
.col-meta  { color:var(--muted); font-size:12px; }
.col-cat   { white-space:nowrap; }

.cat-badge { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.3px;
             padding:2px 7px; border-radius:2px; text-transform:uppercase; }
.for-sale   { background:#dbeafe; color:#1e40af; }
.for-free   { background:#dcfce7; color:#166534; }
.wanted     { background:#fef9c3; color:#854d0e; }
.services   { background:#f3e8ff; color:#6b21a8; }
.housing    { background:#ffedd5; color:#9a3412; }
.jobs       { background:#e0f2fe; color:#075985; }
.childcare  { background:#fce7f3; color:#9d174d; }
.community  { background:#f0fdf4; color:#14532d; }

.action-cell { white-space:nowrap; display:flex; gap:6px; }
.btn-approve { background:#166534; color:#fff; border:none; padding:6px 12px;
               font-size:12px; font-weight:700; border-radius:2px; cursor:pointer; }
.btn-approve:hover { background:#14532d; }
.btn-reject  { background:#991b1b; color:#fff; border:none; padding:6px 12px;
               font-size:12px; font-weight:700; border-radius:2px; cursor:pointer; }
.btn-reject:hover  { background:#7f1d1d; }
.btn-delete  { background:#6a7d96; color:#fff; border:none; padding:6px 12px;
               font-size:12px; font-weight:700; border-radius:2px; cursor:pointer; }
.btn-delete:hover  { background:#4a5568; }

.empty { padding:24px; text-align:center; color:var(--muted); font-size:14px; background:#fff; }
.reload-btn { background:none; border:1px solid #a8c4e0; color:#a8c4e0; padding:4px 10px;
              font-size:12px; border-radius:2px; cursor:pointer; }
.reload-btn:hover { background:#01245a; }

.stats-picker { background:#fff; padding:14px 16px; border-bottom:1px solid var(--border);
                display:flex; align-items:center; gap:10px; }
.stats-picker select { padding:7px 10px; border:1px solid var(--border); font-size:13.5px;
                       border-radius:2px; min-width:240px; }
.stat-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
              gap:12px; background:#fff; padding:16px; }
.stat-card { background:#f8fafc; border:1px solid var(--border); border-radius:4px;
             padding:14px 16px; text-align:center; }
.stat-card .n { font-size:26px; font-weight:700; color:var(--navy); }
.stat-card .l { font-size:12px; color:var(--muted); margin-top:4px; }
.link-click-row { display:flex; justify-content:space-between; padding:8px 16px;
                   border-bottom:1px solid var(--border); font-size:13.5px; }
.link-click-row:last-child { border-bottom:none; }
.link-click-row .n { font-weight:700; color:var(--navy); }
</style>
</head>
<body>

<div class="header">
  <h1>Parish Admin &mdash; St. Nicholas</h1>
  <button class="reload-btn" onclick="load()">&#8635; Refresh</button>
</div>

<div class="token-bar">
  <label for="tokenInput"><strong>Admin token:</strong></label>
  <input id="tokenInput" name="stn_business_stats_token" type="text" placeholder="Paste ADMIN_TOKEN here"
         autocomplete="off" data-lpignore="true" data-1p-ignore data-bwignore
         style="font-family:monospace; -webkit-text-security:disc;"
         oninput="saveToken()">
  <button onclick="load()">Load</button>
  <span class="token-status" id="tokenStatus"></span>
</div>

<div class="body">
  <!-- Pending -->
  <div>
    <div class="section-title accordion-title open" onclick="toggleSection(this)">
      <span>Pending Review <span class="badge" id="pendingCount">0</span></span>
      <span class="accordion-chevron">&#9656;</span>
    </div>
    <div class="accordion-body" id="pendingArea-wrap"><div id="pendingArea"><div class="empty">Enter your admin token and click Load.</div></div></div>
  </div>

  <!-- Live -->
  <div>
    <div class="section-title accordion-title" onclick="toggleSection(this)">
      <span>Live Listings <span class="badge green" id="liveCount">0</span></span>
      <span class="accordion-chevron">&#9656;</span>
    </div>
    <div class="accordion-body collapsed" id="liveArea-wrap"><div id="liveArea"></div></div>
  </div>

  <!-- Business Stats -->
  <div>
    <div class="section-title accordion-title" onclick="toggleSection(this)">
      <span>Parishioner Business Stats</span>
      <span class="accordion-chevron">&#9656;</span>
    </div>
    <div class="accordion-body collapsed" id="bizStats-wrap">
      <div class="stats-picker">
        <label for="bizSelect"><strong>Business:</strong></label>
        <select id="bizSelect" onchange="loadBizStats()">
          <option value="">Select a business…</option>
        </select>
      </div>
      <div id="bizStatsArea"><div class="empty">Load your token above, then pick a business.</div></div>
    </div>
  </div>

  <!-- Poll Votes -->
  <div>
    <div class="section-title accordion-title" onclick="toggleSection(this)">
      <span>Poll Votes</span>
      <span class="accordion-chevron">&#9656;</span>
    </div>
    <div class="accordion-body collapsed" id="pollsArea-wrap">
      <div id="pollsArea"><div class="empty">Load your token above to see poll results.</div></div>
    </div>
  </div>
</div>

<script>
const API = 'https://stnicholas-classifieds.photoromano.workers.dev';
const POLL_API = 'https://stnicholas-social-poll.photoromano.workers.dev';
const POLL_LABELS = {
  'parish-social-2026-10-17': 'Parish Social Night (Oct 17)',
};
const POLL_OPTION_LABELS = {
  'movie-night': '🎥 Movie Night & Popcorn Bar',
  'bingo-night': '🎯 Bingo Night',
  'game-night': '🎲 Game Night',
  'fellowship-social': '☕ Fellowship Social',
  'other': '✍️ Write-in (other)',
};

function toggleSection(titleEl) {
  const body = titleEl.nextElementSibling;
  const willOpen = body.classList.contains('collapsed');
  document.querySelectorAll('.accordion-body').forEach(b => b.classList.add('collapsed'));
  document.querySelectorAll('.accordion-title').forEach(t => t.classList.remove('open'));
  if (willOpen) {
    body.classList.remove('collapsed');
    titleEl.classList.add('open');
  }
}

const CAT_CLASS = {
  'For Sale':'for-sale','For Free':'for-free','Wanted':'wanted','Services':'services',
  'Housing':'housing','Jobs':'jobs','Childcare':'childcare','Community':'community',
};

function getToken() { return localStorage.getItem('stn_admin_token') || ''; }
function saveToken() {
  localStorage.setItem('stn_admin_token', document.getElementById('tokenInput').value.trim());
}

window.addEventListener('DOMContentLoaded', () => {
  const t = getToken();
  if (t) { document.getElementById('tokenInput').value = t; load(); }
});

function authHeaders() {
  return { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' };
}

async function load() {
  const status = document.getElementById('tokenStatus');
  status.textContent = 'Loading…'; status.className = 'token-status';

  try {
    const [pRes, lRes] = await Promise.all([
      fetch(`${API}/api/admin/pending`, { headers: authHeaders() }).then(r => r.json()),
      fetch(`${API}/api/admin/all`,     { headers: authHeaders() }).then(r => r.json()),
    ]);

    if (!pRes.ok) {
      status.textContent = 'Auth failed — check your token.'; status.className = 'token-status err';
      return;
    }

    status.textContent = 'Connected'; status.className = 'token-status ok';

    renderPending(pRes.listings || []);
    renderLive(lRes.listings || []);
    loadBizList();
    loadPolls();
  } catch (e) {
    status.textContent = 'Network error'; status.className = 'token-status err';
  }
}

async function loadBizList() {
  try {
    const res = await fetch(`${API}/api/admin/businesses`, { headers: authHeaders() });
    const data = await res.json();
    if (!data.ok) return;
    const sel = document.getElementById('bizSelect');
    const current = sel.value;
    sel.innerHTML = '<option value="">Select a business…</option>' +
      (data.businesses || []).map(b =>
        `<option value="${esc(b.slug)}">${esc(b.name)}${b.status !== 'active' ? ' (inactive)' : ''}</option>`
      ).join('');
    if (current) sel.value = current;
  } catch {}
}

async function loadBizStats() {
  const slug = document.getElementById('bizSelect').value;
  const area = document.getElementById('bizStatsArea');
  if (!slug) { area.innerHTML = '<div class="empty">Pick a business.</div>'; return; }

  area.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const res = await fetch(`${API}/api/admin/businesses/${encodeURIComponent(slug)}/stats`, { headers: authHeaders() });
    const data = await res.json();
    if (!data.ok) { area.innerHTML = `<div class="empty">${esc(data.error || 'Could not load stats.')}</div>`; return; }

    const lc = data.link_clicks || {};
    const linkLabels = { website: 'Website', facebook: 'Facebook', instagram: 'Instagram', phone: 'Phone', email: 'Email' };

    area.innerHTML = `
      <div class="stat-cards">
        <div class="stat-card"><div class="n">${data.total_impressions}</div><div class="l">Directory impressions</div></div>
        <div class="stat-card"><div class="n">${data.total_views}</div><div class="l">Detail-page views</div></div>
        <div class="stat-card"><div class="n">${data.click_through_rate ?? '—'}${data.click_through_rate != null ? '%' : ''}</div><div class="l">Click-through rate</div></div>
        <div class="stat-card"><div class="n">${data.clicks_from_directory}</div><div class="l">Clicks from directory grid</div></div>
      </div>
      <div class="section-title" style="margin-top:0;">Outbound Link Clicks</div>
      ${Object.keys(linkLabels).map(k => `
        <div class="link-click-row"><span>${linkLabels[k]}</span><span class="n">${lc[k] || 0}</span></div>
      `).join('')}
      <div class="section-title" style="margin-top:0;">Monthly (full history — compare any two months)</div>
      ${(data.monthly && data.monthly.length) ? `
        <table>
          <thead><tr><th>Month</th><th>Impressions</th><th>Views</th><th>Link Clicks</th><th>From Directory</th><th>vs. Prior Month</th></tr></thead>
          <tbody>${data.monthly.map((m, i) => {
            const prev = i > 0 ? data.monthly[i - 1] : null;
            const delta = prev ? pctDelta(prev.views, m.views) : null;
            return `<tr><td>${fmtMonth(m.month)}</td><td>${m.impressions}</td><td>${m.views}</td><td>${m.link_clicks}</td><td>${m.clicks_from_directory}</td><td>${deltaLabel(delta)}</td></tr>`;
          }).join('')}</tbody>
        </table>` : '<div class="empty">No activity recorded yet.</div>'}
      <div class="section-title" style="margin-top:0;">Daily (last 30 days)</div>
      ${(data.daily_last_30d && data.daily_last_30d.length) ? `
        <table>
          <thead><tr><th>Date</th><th>Views</th><th>Impressions</th></tr></thead>
          <tbody>${data.daily_last_30d.map(d => `<tr><td>${fmtDate(d.day)}</td><td>${d.views}</td><td>${d.impressions}</td></tr>`).join('')}</tbody>
        </table>` : '<div class="empty">No activity in the last 30 days.</div>'}
    `;
  } catch {
    area.innerHTML = '<div class="empty">Network error.</div>';
  }
}

async function loadPolls() {
  const area = document.getElementById('pollsArea');
  area.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const pollsRes = await fetch(`${POLL_API}/admin/polls`, { headers: authHeaders() });
    const pollsData = await pollsRes.json();
    if (!pollsData.ok) { area.innerHTML = `<div class="empty">${esc(pollsData.error || 'Could not load polls.')}</div>`; return; }
    const polls = pollsData.polls || [];
    if (!polls.length) { area.innerHTML = '<div class="empty">No polls configured.</div>'; return; }

    const sections = await Promise.all(polls.map(async (pollId) => {
      const res = await fetch(`${POLL_API}/results?poll=${encodeURIComponent(pollId)}`, { headers: authHeaders() });
      const data = await res.json();
      if (!data.ok) return `<div class="section-title" style="margin-top:0;">${esc(POLL_LABELS[pollId] || pollId)}</div><div class="empty">Error loading results.</div>`;
      const counts = data.counts || {};
      const writeins = data.writeins || [];
      const max = Math.max(1, ...Object.values(counts));
      const total = Object.values(counts).reduce((a, b) => a + b, 0);
      const bars = Object.entries(counts).map(([opt, n]) => `
        <div class="link-click-row" style="display:block;padding:10px 16px;">
          <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px;">
            <span>${esc(POLL_OPTION_LABELS[opt] || opt)}</span><span class="n">${n}</span>
          </div>
          <div style="background:#eef1f6;border-radius:2px;height:8px;overflow:hidden;">
            <div style="background:var(--navy);height:100%;width:${Math.round((n / max) * 100)}%;"></div>
          </div>
        </div>`).join('');
      const writeinsHtml = writeins.length ? `
        <div class="section-title" style="margin-top:0;">Write-ins (${writeins.length})</div>
        <div style="background:#fff;padding:12px 16px;">
          <ul style="padding-left:18px;font-size:13.5px;color:#444;">
            ${writeins.map(w => `<li>${esc(w)}</li>`).join('')}
          </ul>
        </div>` : '';
      return `
        <div class="section-title" style="margin-top:0;">${esc(POLL_LABELS[pollId] || pollId)} — ${total} vote${total === 1 ? '' : 's'}</div>
        <div style="background:#fff;">${bars}</div>
        ${writeinsHtml}`;
    }));

    area.innerHTML = sections.join('');
  } catch {
    area.innerHTML = '<div class="empty">Network error.</div>';
  }
}

function renderPending(items) {
  document.getElementById('pendingCount').textContent = items.length;
  const area = document.getElementById('pendingArea');
  if (!items.length) { area.innerHTML = '<div class="empty">No listings pending review.</div>'; return; }

  area.innerHTML = `
    <table>
      <thead><tr>
        <th>Category</th><th>Title</th><th>Description</th>
        <th>Contact</th><th>Name</th><th>Submitted</th><th>Actions</th>
      </tr></thead>
      <tbody>
        ${items.map(l => `
          <tr id="p${l.id}">
            <td class="col-cat"><span class="cat-badge ${CAT_CLASS[l.category]||'community'}">${esc(l.category)}</span></td>
            <td class="col-title">${esc(l.title)}</td>
            <td class="col-desc">${esc(l.description)}</td>
            <td>${esc(l.contact)}</td>
            <td>${esc(l.name)}</td>
            <td class="col-meta">${fmtDate(l.submitted_at)}</td>
            <td><div class="action-cell">
              <button class="btn-approve" onclick="approve(${l.id})">Approve</button>
              <button class="btn-reject"  onclick="reject(${l.id})">Reject</button>
            </div></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

function renderLive(items) {
  document.getElementById('liveCount').textContent = items.length;
  const area = document.getElementById('liveArea');
  if (!items.length) { area.innerHTML = '<div class="empty">No live listings.</div>'; return; }

  area.innerHTML = `
    <table>
      <thead><tr>
        <th>Category</th><th>Title</th><th>Description</th>
        <th>Contact</th><th>Name</th><th>Approved</th><th>Expires</th><th></th>
      </tr></thead>
      <tbody>
        ${items.map(l => `
          <tr id="l${l.id}">
            <td class="col-cat"><span class="cat-badge ${CAT_CLASS[l.category]||'community'}">${esc(l.category)}</span></td>
            <td class="col-title">${esc(l.title)}</td>
            <td class="col-desc">${esc(l.description)}</td>
            <td>${esc(l.contact)}</td>
            <td>${esc(l.name)}</td>
            <td class="col-meta">${fmtDate(l.approved_at)}</td>
            <td class="col-meta">${fmtDate(l.expires_at)}</td>
            <td><button class="btn-delete" onclick="remove(${l.id})">Remove</button></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

async function approve(id) {
  const res = await fetch(`${API}/api/admin/approve/${id}`, { method:'POST', headers: authHeaders() });
  const data = await res.json();
  if (data.ok) { document.getElementById(`p${id}`)?.remove(); load(); }
  else alert('Error: ' + data.error);
}

async function reject(id) {
  if (!confirm('Reject and discard this listing?')) return;
  const res = await fetch(`${API}/api/admin/reject/${id}`, { method:'POST', headers: authHeaders() });
  const data = await res.json();
  if (data.ok) { document.getElementById(`p${id}`)?.remove(); updateCount('pendingCount', -1); }
  else alert('Error: ' + data.error);
}

async function remove(id) {
  if (!confirm('Remove this live listing permanently?')) return;
  const res = await fetch(`${API}/api/admin/listings/${id}`, { method:'DELETE', headers: authHeaders() });
  const data = await res.json();
  if (data.ok) { document.getElementById(`l${id}`)?.remove(); updateCount('liveCount', -1); }
  else alert('Error: ' + data.error);
}

function updateCount(id, delta) {
  const el = document.getElementById(id);
  el.textContent = Math.max(0, parseInt(el.textContent) + delta);
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

function fmtMonth(ym) {
  const [y, m] = ym.split('-');
  return new Date(+y, +m - 1, 1).toLocaleDateString('en-US', { month:'long', year:'numeric' });
}

function pctDelta(prev, curr) {
  if (!prev) return curr ? null : 0;
  return +(100 * (curr - prev) / prev).toFixed(1);
}

function deltaLabel(delta) {
  if (delta === null) return '—';
  const color = delta > 0 ? '#166534' : (delta < 0 ? '#991b1b' : 'var(--muted)');
  const sign = delta > 0 ? '+' : '';
  return `<span style="color:${color};font-weight:700;">${sign}${delta}%</span>`;
}

function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
