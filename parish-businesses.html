<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parishioner Businesses — St. Nicholas Serbian Orthodox Church</title>
<style>
:root {
  --navy:  #02306e;
  --gold:  #c9a227;
  --red:   #c31f27;
  --light: #eef1f6;
  --card:  #ffffff;
  --border:#c8d5e8;
  --muted: #6a7d96;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: var(--light); color: #2b2b2b; }

.pb-header { background: linear-gradient(135deg, #01245a 0%, #02306e 45%, #0a4a9e 100%); padding: 22px 24px 16px; border-bottom: 4px solid var(--gold); }
.pb-header-row { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.pb-header h1 { color: #fff; font-size: 22px; font-weight: 700; letter-spacing: .4px; }
.pb-header p  { color: #a8c4e0; font-size: 13px; margin-top: 4px; }

.btn-advertise {
  display: inline-block; background: var(--gold); color: #3a2e00; border: none; padding: 10px 20px;
  font-size: 13.5px; font-weight: 700; cursor: pointer; border-radius: 2px; white-space: nowrap;
  text-decoration: none;
}
.btn-advertise:hover { background: #b8911f; }

.pb-toolbar { background: #fff; border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search-input {
  flex: 1; min-width: 220px; max-width: 420px; padding: 8px 12px; font-size: 14px; font-family: inherit;
  border: 1px solid var(--border); border-radius: 2px; color: #2b2b2b;
}
.search-input:focus { outline: 2px solid var(--navy); border-color: var(--navy); }

.cat-bar { background: var(--light); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; gap: 6px; flex-wrap: wrap; }
.cat-chip {
  padding: 5px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border); border-radius: 20px; color: var(--muted);
  background: #fff; white-space: nowrap;
}
.cat-chip:hover  { border-color: var(--navy); color: var(--navy); }
.cat-chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }

.pb-body { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
.biz-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
@media (max-width: 560px) { .biz-grid { grid-template-columns: 1fr; } }

.biz-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 4px;
  overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit;
  transition: box-shadow .15s, border-color .15s;
}
.biz-card:hover { border-color: #9ab0cc; box-shadow: 0 3px 10px rgba(0,0,0,.09); }
.biz-card-img-wrap { width: 100%; aspect-ratio: 2 / 1; background: #f0f4fb; overflow: hidden; position: relative; }
.biz-card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.biz-featured-badge {
  position: absolute; top: 8px; left: 8px; background: var(--gold); color: #3a2e00;
  font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 2px; letter-spacing: .3px; text-transform: uppercase;
}
.biz-card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.biz-cat-badge {
  align-self: flex-start; font-size: 10.5px; font-weight: 700; letter-spacing: .3px;
  padding: 2px 8px; border-radius: 2px; text-transform: uppercase; background: #f0f4fb; color: var(--navy);
}
.biz-name { font-size: 15.5px; font-weight: 700; color: var(--navy); line-height: 1.3; }
.biz-tagline { font-size: 12.5px; color: #555; line-height: 1.45; flex: 1; white-space: pre-line; }
.biz-cta { font-size: 12px; font-weight: 700; color: var(--navy); margin-top: 4px; }
.biz-card:hover .biz-cta { text-decoration: underline; }

.empty-state { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 16px; }

</style>
</head>
<body>

<div class="pb-header">
  <div class="pb-header-row">
    <div>
      <h1>Parishioner Businesses</h1>
      <p>Parishioners and friends of the parish can advertise their business here.</p>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
      <a class="btn-advertise" href="https://stnicholasphilly.org/advertise-with-us">Contact Us to Advertise</a>
    </div>
  </div>
</div>

<div class="pb-toolbar">
  <input type="text" class="search-input" id="searchInput" placeholder="Search businesses…" oninput="renderGrid()">
</div>
<div class="cat-bar" id="catBar"></div>

<div class="pb-body">
  <div class="biz-grid" id="bizGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">No businesses match your search yet.</div>
</div>

<script>
const API = 'https://stnicholas-classifieds.photoromano.workers.dev';
const BIZ_DETAIL_PAGE = 'https://stnicholasphilly.org/business';

// Site-wide language preference, same stn_lang cookie the header EN/СР
// toggle sets everywhere else on stnicholasphilly.org (data-l="en"/"sr").
function siteLang() {
  // The site sets stn_lang at more than one cookie scope (confirmed live
  // 2026-09-30 -- two distinct stn_lang cookies coexist after toggling).
  // Per RFC 6265, cookies with longer/more specific paths sort first in
  // document.cookie, so the path=/ cookie this page writes always sorts
  // LAST -- take the last match rather than "any sr wins", or a stale
  // narrower-path cookie permanently overrides this page's own toggle.
  const pairs = document.cookie.split(';').map(c => c.trim()).filter(c => c.startsWith('stn_lang='));
  const last = pairs[pairs.length - 1];
  return last === 'stn_lang=sr' ? 'sr' : 'en';
}

function setSiteLang(lang) {
  document.cookie = `stn_lang=${lang}; path=/; max-age=31536000`;
  applySiteLang();
  renderGrid();
}

function applySiteLang() {
  const lang = siteLang();
  document.querySelectorAll('.stn-lang-btn[data-l]').forEach(btn => {
    btn.classList.toggle('stn-lang-active', btn.dataset.l === lang);
  });
  const searchInput = document.getElementById('searchInput');
  if (searchInput) searchInput.placeholder = uiText('searchPlaceholder', 'Search businesses…');
}

// The site's own header EN/СР buttons (.stn-lang-btn[data-l="en"/"sr"])
// don't reliably update stn_lang themselves (confirmed live 2026-09-30 --
// clicking them fires zero network requests and touches no cookie).
// Rather than build a second, redundant toggle, this page attaches its
// own working handler directly onto those SAME existing buttons -- via
// delegation on document, since the header bar they live in may not
// exist in the DOM yet when this section's script runs.
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.stn-lang-btn[data-l]');
  if (btn) setSiteLang(btn.dataset.l);
});

const CATEGORIES = ['Food & Catering','Retail & Shops','Professional Services','Home & Trade Services','Health & Wellness','Other'];
// Fixed, short UI-chrome strings -- safe to translate directly (same tier as
// the site's own nav-label OVR dictionary). Free-form business copy (name,
// tagline) is NOT translated here -- that needs a real Serbian speaker's
// review, same standard as the newsletter's own bilingual content.
const CATEGORY_SR = {
  'Food & Catering': 'Храна и кетеринг',
  'Retail & Shops': 'Продавнице',
  'Professional Services': 'Професионалне услуге',
  'Home & Trade Services': 'Услуге за дом',
  'Health & Wellness': 'Здравље и велнес',
  'Other': 'Остало',
};
const UI_SR = {
  all: 'Све',
  featured: 'Истакнуто',
  clickForDetails: 'Кликните за детаље →',
  emptyState: 'Тренутно нема резултата претраге.',
  searchPlaceholder: 'Претражите послове…',
};
function categoryLabel(cat) { return siteLang() === 'sr' ? (CATEGORY_SR[cat] || cat) : cat; }
// Business name is a proper noun/brand -- stays the same in both languages.
// Tagline is business-specific prose -- only shown in Serbian if the owner
// has provided a real (board-reviewed-standard) tagline_sr; no machine
// translation, matching the newsletter's own hand-translation rule.
function taglineFor(b) { return (siteLang() === 'sr' && b.tagline_sr) ? b.tagline_sr : (b.tagline || ''); }
function uiText(key, en) { return siteLang() === 'sr' ? UI_SR[key] : en; }

let allBusinesses = [];
let activeCategory = null;

function catSlug(cat) { return cat.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }

function renderCatBar() {
  const bar = document.getElementById('catBar');
  bar.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'cat-chip' + (activeCategory === null ? ' active' : '');
  allChip.textContent = uiText('all', 'All');
  allChip.onclick = () => { activeCategory = null; renderCatBar(); renderGrid(); };
  bar.appendChild(allChip);
  CATEGORIES.forEach(cat => {
    const chip = document.createElement('button');
    chip.className = 'cat-chip' + (activeCategory === cat ? ' active' : '');
    chip.textContent = categoryLabel(cat);
    chip.onclick = () => { activeCategory = cat; renderCatBar(); renderGrid(); };
    bar.appendChild(chip);
  });
}

function renderGrid() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const grid = document.getElementById('bizGrid');
  const empty = document.getElementById('emptyState');
  grid.innerHTML = '';

  const filtered = allBusinesses.filter(b => {
    if (activeCategory && b.category !== activeCategory) return false;
    if (q && !(b.name.toLowerCase().includes(q) || (b.tagline||'').toLowerCase().includes(q))) return false;
    return true;
  });

  empty.textContent = uiText('emptyState', 'No businesses match your search yet.');
  empty.style.display = filtered.length ? 'none' : 'block';

  filtered.forEach(b => {
    const a = document.createElement('a');
    a.className = 'biz-card';
    a.href = `${BIZ_DETAIL_PAGE}?slug=${encodeURIComponent(b.slug)}`;
    const img = (siteLang() === 'sr' && b.card_image_url_sr) || b.card_image_url || 'https://placehold.co/400x800/eef1f6/6a7d96?text=' + encodeURIComponent(b.name);
    a.innerHTML = `
      <div class="biz-card-img-wrap">
        ${b.featured ? `<span class="biz-featured-badge">${uiText('featured', 'Featured')}</span>` : ''}
        <img class="biz-card-img" src="${img}" alt="${b.name}" loading="lazy">
      </div>
      <div class="biz-card-body">
        <span class="biz-cat-badge">${categoryLabel(b.category)}</span>
        <div class="biz-name">${b.name}</div>
        <div class="biz-tagline">${taglineFor(b)}</div>
        <div class="biz-cta">${uiText('clickForDetails', 'Click for details &rarr;')}</div>
      </div>
    `;
    grid.appendChild(a);
  });
}

async function loadBusinesses() {
  applySiteLang();
  try {
    const res = await fetch(`${API}/api/businesses`);
    const data = await res.json();
    allBusinesses = data.ok ? data.businesses : [];
  } catch {
    allBusinesses = [];
  }
  renderCatBar();
  renderGrid();
}

loadBusinesses();
</script>

<script>
(function fixMobileNav() {
  var MAP = {
    'Parishioner Businesses': '/parish-businesses',
    'Parish Classifieds': '/classifieds',
    'Advertise With Us': '/advertise-with-us',
  };
  function patch() {
    document.querySelectorAll('a[href*="shop.html"]').forEach(function(a) {
      var dest = MAP[a.textContent.trim()];
      if (dest) a.href = dest;
    });
  }
  patch();
  document.addEventListener('DOMContentLoaded', patch);
  new MutationObserver(patch).observe(document.documentElement, {childList:true, subtree:true});
})();
</script>

</body>
</html>
